<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1A3A2A">
<title>Fördermittel · Leben Pflegen Reisen e.V.</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.fm-wrap { max-width: 1050px; margin: 32px auto 60px; padding: 0 24px; }

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 0 0 14px; font-size: 14px; font-weight: 600;
  color: #1A3A2A; text-decoration: none;
}
.back-link:hover { text-decoration: underline; }

.fm-header {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}
.fm-header h1 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 24px;
  color: var(--green-deep);
  margin: 0 0 6px;
  letter-spacing: -.02em;
}
.fm-header p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; max-width: 620px; }

.fm-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

/* Tabs */
.fm-tabs {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 16px;
}
.fm-tabs button {
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 9px 16px; border-radius: 999px;
  border: 1.5px solid var(--border); background: #fff; color: var(--muted);
  cursor: pointer;
}
.fm-tabs button:hover { border-color: var(--green-mute); color: var(--text); }
.fm-tabs button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.fm-tabs button[aria-selected="true"] {
  background: var(--green-deep); border-color: var(--green-deep); color: #fff;
}

.fm-card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 16px;
}

.fm-gruppe {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 15px; color: var(--green-deep);
  margin: 0; padding: 14px 18px;
  border-bottom: 1.5px solid var(--border);
  background: #FAFAF7;
}

.fm-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.fm-table th {
  text-align: left; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding: 14px 16px;
  border-bottom: 1.5px solid var(--border);
  background: #FAFAF7;
  white-space: nowrap;
}
.fm-table td { padding: 13px 16px; border-bottom: 1px solid #EFEDE8; vertical-align: middle; }
.fm-table tr:last-child td { border-bottom: none; }

.fm-pill {
  display: inline-flex; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700;
  background: #EFEDE8; color: #4A5450;
  white-space: nowrap;
}
.fm-pill.fm-rot   { background: #FDE3E0; color: #B4231A; }
.fm-pill.fm-gelb  { background: #FFF3D6; color: #8A6200; }
.fm-pill.fm-gruen { background: #EAF3EC; color: #2C6B45; }
.fm-pill.fm-grau  { background: #EFEDE8; color: #57605B; }

.fm-empty, .fm-loading { padding: 40px 24px; text-align: center; color: var(--muted); }

@media (max-width: 720px) {
  .fm-wrap { padding: 0 14px; }
  .fm-header { padding: 18px; }
}
</style>
</head>
<body>

<a href="#main" class="sr-only">Zum Hauptinhalt springen</a>

<main id="main">
<div class="fm-wrap">

  <a href="mein-bereich.html" class="back-link">← Zurück</a>

  <div class="fm-header">
    <div>
      <h1>Fördermittel</h1>
      <p>Stand der Akquise: Fristen, Programme, offene Aufgaben.
         Programmdaten kommen aus der Wissensbasis und sind hier nicht änderbar.</p>
    </div>
    <div id="fm-stand" class="fm-sub"></div>
  </div>

  <nav class="fm-tabs" role="tablist" aria-label="Bereiche">
    <button type="button" role="tab" data-tab="fristen"   aria-selected="true">Fristen</button>
    <button type="button" role="tab" data-tab="programme" aria-selected="false">Programme</button>
    <button type="button" role="tab" data-tab="aufgaben"  aria-selected="false">Aufgaben</button>
    <button type="button" role="tab" data-tab="straenge"  aria-selected="false">Stränge</button>
  </nav>

  <div id="fm-inhalt" aria-live="polite"><div class="fm-card"><div class="fm-loading">Lädt …</div></div></div>

</div>
</main>

<script src="app.js"></script>
<script src="layout.js"></script>
<script>
'use strict';

LPR_Layout.init({ page: 'foerdermittel' });
if (!LPR.requireRole('admin', 'login.html')) throw new Error('kein Zugriff');
</script>
</body>
</html>
