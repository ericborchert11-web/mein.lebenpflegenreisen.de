<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Leben Pflegen Reisen e.V.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1A3A2A; --lime:#C8F135; --white:#F5F5F0; --muted:#7AAA8A;
  --sans:"Instrument Sans",-apple-system,"Helvetica Neue",sans-serif;
  --display:"Bricolage Grotesque",-apple-system,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--green);color:var(--white);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(24px,6vw,80px);-webkit-font-smoothing:antialiased;
}
.tor{width:100%;max-width:520px}
.chev{width:64px;height:auto;margin-bottom:clamp(22px,3vw,38px);display:block}
.chev .c2{opacity:.42}
.eyebrow{
  font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;
}
h1{
  font-family:var(--display);font-weight:800;letter-spacing:-.02em;
  font-size:clamp(30px,4.4vw,48px);line-height:1.05;margin-bottom:.5em;
}
p.hinweis{font-size:clamp(16px,1.5vw,19px);line-height:1.45;color:var(--muted);margin-bottom:clamp(24px,3vw,36px)}
form{display:flex;flex-wrap:wrap;gap:12px}
input{
  flex:1 1 220px;font:inherit;font-size:19px;
  padding:.7em .9em;border:2px solid rgba(122,170,138,.5);border-radius:4px;
  background:transparent;color:var(--white);
}
input:focus{outline:3px solid var(--lime);outline-offset:2px;border-color:transparent}
button{
  font:inherit;font-weight:600;font-size:19px;cursor:pointer;
  padding:.7em 1.4em;border:0;border-radius:4px;
  background:var(--lime);color:var(--green);
}
button:focus-visible{outline:3px solid var(--white);outline-offset:2px}
button[disabled]{opacity:.55;cursor:progress}
.meldung{margin-top:18px;font-size:17px;color:var(--lime);min-height:1.4em}
.fuss{margin-top:clamp(30px,4vw,52px);font-size:14px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="tor">
  <svg class="chev" viewBox="0 0 130 100" aria-hidden="true">
    <g fill="none" stroke="#C8F135" stroke-linecap="round" stroke-linejoin="round" stroke-width="11">
      <polyline class="c1" points="16,16 56,50 16,84"/>
      <polyline class="c2" points="60,16 100,50 60,84"/>
    </g>
  </svg>
  <p class="eyebrow">Leben Pflegen Reisen e.V.</p>
  <h1>Interner Bereich</h1>
  <p class="hinweis">Diese Seite ist mit einem Kennwort geschützt. Sie erhalten es vom Vorstand.</p>
  <form id="form">
    <input id="pass" type="password" autocomplete="current-password" autofocus
           aria-label="Kennwort" placeholder="Kennwort">
    <button id="knopf" type="submit">Öffnen</button>
  </form>
  <p class="meldung" id="meldung" role="status" aria-live="polite"></p>
  <p class="fuss">Falls das Feld nicht reagiert: Die Entschlüsselung läuft im Browser und benötigt eine
    <code>https</code>-Verbindung. Über eine lokal geöffnete Datei funktioniert sie nicht.</p>
</main>

<script>
(function(){
  "use strict";
  var SALT = "YOoU88ttBTPDmQSkcK/v9Q==", IV = "0dO9B6rKLGE6zVuu", ITER = 310000;
  var form = document.getElementById('form');
  var feld = document.getElementById('pass');
  var knopf = document.getElementById('knopf');
  var meldung = document.getElementById('meldung');

  function roh(b64){
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  if (!(window.crypto && window.crypto.subtle)) {
    meldung.textContent = 'Dieser Browser stellt keine Entschlüsselung bereit (kein sicherer Kontext).';
    knopf.disabled = true;
    return;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var wort = feld.value;
    if (!wort) return;
    knopf.disabled = true;
    meldung.textContent = 'Einen Moment …';

    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(wort), 'PBKDF2', false, ['deriveKey'])
      .then(function(basis){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt: roh(SALT), iterations: ITER, hash:'SHA-256'},
          basis, {name:'AES-GCM', length:256}, false, ['decrypt']);
      })
      .then(function(schluessel){
        return crypto.subtle.decrypt(
          {name:'AES-GCM', iv: roh(IV)}, schluessel,
          roh(document.getElementById('nutzlast').textContent.trim()));
      })
      .then(function(klar){
        var html = new TextDecoder().decode(klar);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){
        knopf.disabled = false;
        meldung.textContent = 'Das Kennwort stimmt nicht.';
        feld.value = '';
        feld.focus();
      });
  });
})();
</script>
